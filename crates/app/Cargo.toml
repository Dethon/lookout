[package]
name = "lookout"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lookout-core = { path = "../core" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
log = { version = "0.4", features = ["std"] }
open = "5"
rfd = "0.17"
# Software renderer only: GPU renderers cost 80-240 MB of driver memory.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# The original of a message, in the reading pane (see `viewer.rs`).
[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
memory-stats = "1"
# Renders assets/icon.svg in the icon example.
resvg = { version = "0.45", default-features = false }

[build-dependencies]
slint-build = "1.18"

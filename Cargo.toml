[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding, so a panic drawing a message falls back to the native view
# instead of closing Lookout.
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2

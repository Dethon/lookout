[package]
name = "lookout"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lookout-core = { path = "../core" }
base64 = "0.22"
# Blitz draws messages as sent (see `page.rs`). A beta, so pinned exactly:
# upgrades are deliberate.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["floats", "svg", "woff", "system-fonts"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.4"
anyrender = "=0.14.0"
anyrender_vello_cpu = "=0.18.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
log = { version = "0.4", features = ["std"] }
open = "5"
rfd = "0.17"
# Software renderer only: GPU renderers cost 80-240 MB of driver memory.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# WebView2, to compare Blitz's drawing with a browser's (see `viewer.rs`).
[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }
# Asks whether Windows wants the window painted (see `repaint.rs`), keeps
# to one window (see `instance.rs`), and starts with Windows (see
# `autostart.rs`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# The notification area icon (see `tray.rs`).
tray-icon = { version = "0.26", default-features = false }
# Windows notifications (see `notify.rs`).
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_Com"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
memory-stats = "1"
# Renders assets/icon.svg in the icon example.
resvg = { version = "0.45", default-features = false }

[build-dependencies]
slint-build = "1.18"
